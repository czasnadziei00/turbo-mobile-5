<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>TURBO MOBILE 5 — XTB + AI Vision</title>

  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #444; padding:4px 6px; text-align:center; }
    th { background:#222; }
    .signal-buy { background:#006400; color:#fff; }
    .signal-prawiebuy { background:#228B22; color:#fff; }
    .signal-czekaj { background:#333; color:#fff; }
    .signal-czekajdo { background:#444; color:#fff; }
    .signal-uwagarese { background:#8B0000; color:#fff; }
    .signal-reset { background:#FF0000; color:#fff; }
    .trail-active { outline:2px solid #00FFFF; }
    .price-input, .entry-input { width:100%; box-sizing:border-box; }
    button { cursor:pointer; }
    .reset-btn { background:#b00; color:#fff; padding:6px 10px; }
  </style>
</head>
<body>

<h2>TURBO MOBILE 5 — XTB + AI Vision</h2>

<button onclick="resetTable1()" class="reset-btn">
  RESET (czyści wszystko oprócz ENTRY)
</button>

<input type="file" id="ocr-file-input" accept="image/*" style="display:none"
       onchange="wczytajOCRZPlikow(event)">

<table>
  <thead>
    <tr>
      <th>📊</th>
      <th>Ticker</th>
      <th>Cena</th>
      <th>Entry</th>
      <th>Sygnał</th>
      <th>Widełki</th>
      <th>TP1</th>
      <th>TP2</th>
      <th>TP3</th>
      <th>🎤</th>
      <th>📎</th>
      <th>Akcje</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
/* ============================================================
   BACKEND OCR
   ============================================================ */
const OCR_URL = "https://turbo-mobile83.onrender.com/ocr";

/* ============================================================
   REGIONY OCR
   ============================================================ */
function R(x1, y1, w, h) {
  return { x1, y1, x2: x1 + w, y2: y1 + h };
}

const REGIONY = {
  portrait: {
    BLOK1: R(3, 291, 770, 286),
    BLOK2: R(695, 116, 101, 76),
    BLOK3: R(8, 1267, 297, 76),
    BLOK4: R(2, 1778, 776, 60),
  },
  landscape: {
    BLOK1: R(237, 149, 1532, 217),
    BLOK2: R(86, 702, 121, 90),
    BLOK3: R(106, 700, 108, 85),
    BLOK4: R(228, 776, 1124, 50),
  }
};
/* ============================================================
   OCR
   ============================================================ */
async function wczytajOCRZPlikow(event) {
  const pliki = event.target.files;
  if (!pliki || pliki.length === 0) return;

  for (const plik of pliki) await startOCR(plik);
  event.target.value = "";
}

async function startOCR(file) {
  try {
    const form = new FormData();
    form.append("file", file);

    const res = await fetch(OCR_URL, { method: "POST", body: form });
    const d = await res.json();

    zapiszDaneDoKorelacji(d);
    dodajLubAktualizujWiersz(d);
    zapiszTabele();
  } catch (e) {
    alert("Błąd OCR backendu");
  }
}

/* ============================================================
   KORELACJA KGHM ↔ COPPER
   ============================================================ */
let lastCopper = null;
let lastKGHM = null;

function zapiszDaneDoKorelacji(d) {
  if (d.ticker === "COPPER") lastCopper = d;
  if (d.ticker === "KGHM")   lastKGHM   = d;
}

function zastosujKorelacjeKGHM(w) {
  if (!lastCopper || w.dataset.ticker !== "KGHM") return;

  const cH = lastCopper.H;
  const cL = lastCopper.L;
  const cC = lastCopper.C;
  const cMA = lastCopper.MA20;

  let s = w.cells[4].innerText;

  if (cC < cL) s = "RESET";

  const buyZone = cC > cL + (cH - cL) * 0.20 && cC < cL + (cH - cL) * 0.35;
  if (buyZone && s === "PRAWIE BUY") s = "BUY";

  if (cMA && cC > cMA && s === "CZEKAJ") s = "PRAWIE BUY";

  w.cells[4].innerText = s;
  kolorujSygnal(w, s);
}

/* ============================================================
   TWORZENIE / AKTUALIZACJA WIERSZA
   ============================================================ */
let aktywnyWiersz = null;

function dodajLubAktualizujWiersz(d) {
  const tbody = document.getElementById("tbody");

  if (!d || !d.ticker) return;

  let w = [...tbody.rows].find(r => r.dataset.ticker === d.ticker);

  if (!w) {
    w = tbody.insertRow(-1);
    w.dataset.ticker = d.ticker;

    w.insertCell(0).innerText = "📊";
    w.insertCell(1).innerText = d.ticker;
    w.insertCell(2).innerHTML = `<input class="price-input" oninput="aktualizujSygnał(this.closest('tr'));zapiszTabele()">`;
    w.insertCell(3).innerHTML = `<input class="entry-input" oninput="zapiszTabele()">`;
    w.insertCell(4).innerText = "CZEKAJ";
    w.insertCell(5).innerText = "—";
    w.insertCell(6).innerText = "—";
    w.insertCell(7).innerText = "—";
    w.insertCell(8).innerText = "—";
    w.insertCell(9).innerHTML  = `<button onclick="uruchomMikrofon(this.closest('tr'))">🎤</button>`;
    w.insertCell(10).innerHTML = `<button onclick="document.getElementById('ocr-file-input').click()">📎</button>`;
    w.insertCell(11).innerHTML = `<button onclick="usunWiersz(this);zapiszTabele()">🗑 Usuń</button>`;
  }

  if (d.interval) w.dataset.interval = d.interval;

  ["O","H","L","C","MA20","DEMA9","RSI","VOL","ASK","BID"].forEach(k => {
    if (d[k] != null) w.dataset[k] = d[k];
  });

  if (d.C != null && !isNaN(d.C)) {
    w.cells[2].querySelector("input").value = Number(d.C).toFixed(3);
  }

  if (w.dataset.interval === "M15" && d.H && d.L) {
    const dol = d.L + (d.H - d.L) * 0.20;
    const gor = d.L + (d.H - d.L) * 0.35;
    w.cells[5].innerText = dol.toFixed(3) + "–" + gor.toFixed(3);
  }

  aktualizujSygnał(w);
  zastosujKorelacjeKGHM(w);
  sortujPoSygnale();
}
/* ============================================================
   SYGNAŁ 4.5 PRO
   ============================================================ */
function aktualizujSygnał(w) {
  const cena = parseFloat(w.cells[2].querySelector("input").value);
  const cell = w.cells[4];

  if (!w.cells[5].innerText.includes("–") || isNaN(cena)) return;

  const [dol, gor] = w.cells[5].innerText.split("–").map(parseFloat);

  const L     = parseFloat(w.dataset.L     || 0);
  const MA20  = parseFloat(w.dataset.MA20  || 0);
  const DEMA9 = parseFloat(w.dataset.DEMA9 || 0);
  const RSI   = parseFloat(w.dataset.RSI   || 0);
  const VOL   = parseFloat(w.dataset.VOL   || 0);

  const momentum = (DEMA9 && cena > DEMA9) ? "MOCNE" : "SŁABE";
  const bias     = (MA20 && cena > MA20) ? "UP" : "DOWN";

  let rsiPower = RSI >= 55 ? "MOCNE" : RSI >= 50 ? "OK" : "SŁABE";
  let volPower = VOL >= 1500 ? "MOCNE" : VOL >= 500 ? "OK" : "SŁABE";

  let s = "CZEKAJ";

  if (cena < dol) s = "CZEKAJ DO";

  if (cena >= dol && cena <= gor && (momentum === "SŁABE" || rsiPower === "SŁABE"))
    s = "PRAWIE BUY";

  if (
    cena >= dol && cena <= gor &&
    momentum === "MOCNE" &&
    bias === "UP" &&
    (rsiPower === "OK" || rsiPower === "MOCNE") &&
    (volPower === "OK" || volPower === "MOCNE")
  ) s = "BUY";

  if (cena > gor) s = "CZEKAJ";

  if (cena < dol * 0.995 && momentum === "SŁABE" && rsiPower === "SŁABE")
    s = "UWAGA RESET";

  if (cena < L && momentum === "SŁABE" && rsiPower === "SŁABE")
    s = "RESET";

  aktualizujTrailing(w);
  cell.innerText = s;
  kolorujSygnal(w, s);
}

/* ============================================================
   KOLORY SYGNAŁÓW
   ============================================================ */
function kolorujSygnal(w, s) {
  const c = w.cells[4];
  c.className = "";
  c.classList.add(
    s === "BUY" ? "signal-buy" :
    s === "PRAWIE BUY" ? "signal-prawiebuy" :
    s === "CZEKAJ" ? "signal-czekaj" :
    s === "CZEKAJ DO" ? "signal-czekajdo" :
    s === "UWAGA RESET" ? "signal-uwagarese" :
    s === "RESET" ? "signal-reset" : ""
  );
}

/* ============================================================
   TRAILING
   ============================================================ */
function aktualizujTrailing(w) {
  const cena  = parseFloat(w.cells[2].querySelector("input").value);
  const entry = parseFloat(w.cells[3].querySelector("input").value);
  if (isNaN(cena) || isNaN(entry) || entry <= 0) return;

  const tp3 = entry * 1.03;
  const tsl = entry * 1.015;

  w.dataset.TP3 = tp3.toFixed(3);
  w.dataset.TRAILING_SL = tsl.toFixed(3);

  w.classList.toggle("trail-active", cena > tp3);
}

/* ============================================================
   LOCALSTORAGE
   ============================================================ */
function zapiszTabele() {
  const tbody = document.getElementById("tbody");
  const data = [...tbody.rows]
    .filter(r => r.dataset.ticker)
    .map(r => ({
      ticker: r.dataset.ticker,
      price: r.cells[2].querySelector("input").value,
      entry: r.cells[3].querySelector("input").value,
      widełki: r.cells[5].innerText,
      O: r.dataset.O,
      H: r.dataset.H,
      L: r.dataset.L,
      C: r.dataset.C,
      MA20: r.dataset.MA20,
      DEMA9: r.dataset.DEMA9,
      RSI: r.dataset.RSI,
      VOL: r.dataset.VOL,
      interval: r.dataset.interval
    }));

  localStorage.setItem("tabela", JSON.stringify(data));
}

function wczytajTabele() {
  const data = JSON.parse(localStorage.getItem("tabela") || "[]");

  data.forEach(d => {
    if (!d || !d.ticker) return;
    dodajLubAktualizujWiersz(d);
    const w = [...document.getElementById("tbody").rows]
      .find(r => r.dataset.ticker === d.ticker);
    if (w && d.widełki && d.widełki.includes("–")) {
      w.cells[5].innerText = d.widełki;
      aktualizujSygnał(w);
    }
  });

  sortujPoSygnale();
}

/* ============================================================
   RESET
   ============================================================ */
function resetTable1() {
  const tbody = document.getElementById("tbody");

  [...tbody.rows].forEach(r => {
    if (!r.dataset.ticker) return;

    r.cells[2].querySelector("input").value = "";

    r.cells[4].innerText = "CZEKAJ";
    r.cells[5].innerText = "—";
    r.cells[6].innerText = "—";
    r.cells[7].innerText = "—";
    r.cells[8].innerText = "—";

    delete r.dataset.O;
    delete r.dataset.H;
    delete r.dataset.L;
    delete r.dataset.C;
    delete r.dataset.MA20;
    delete r.dataset.DEMA9;
    delete r.dataset.RSI;
    delete r.dataset.VOL;
    delete r.dataset.interval;

    r.classList.remove("trail-active");
  });

  zapiszTabele();
}
/* ============================================================
   KOMENTARZ 4.5 PRO
   ============================================================ */
function komentarz45PRO(w) {
  const t = w.dataset.ticker || "";

  const O = parseFloat(w.dataset.O || 0);
  const H = parseFloat(w.dataset.H || 0);
  const L = parseFloat(w.dataset.L || 0);
  const C = parseFloat(w.dataset.C || 0);

  const MA20  = parseFloat(w.dataset.MA20  || 0);
  const EMA20 = parseFloat(w.dataset.EMA20 || 0);
  const DEMA9 = parseFloat(w.dataset.DEMA9 || 0);
  const RSI   = parseFloat(w.dataset.RSI   || 0);
  const VOL   = parseFloat(w.dataset.VOL   || 0);

  const widełki = w.cells[5].innerText || "—";
  const sygnał  = w.cells[4].innerText || "—";

  let txt = `⭐ ANALIZA 4.5 PRO — ${t}\n\n`;

  txt += `1. STRUKTURA M15\nO=${O}\nH=${H}\nL=${L}\nC=${C}\n\n`;
  txt += `2. MOMENTUM\nDEMA9=${DEMA9} → ${C > DEMA9 ? "impuls NAD" : "impuls POD"}\n\n`;
  txt += `3. TREND\nMA20=${MA20} → ${C > MA20 ? "UP" : "DOWN"}\nEMA20=${EMA20} → ${C > EMA20 ? "UP" : "DOWN"}\n\n`;
  txt += `4. RSI\nRSI=${RSI}\n\n`;
  txt += `5. VOLUME\nVOL=${VOL}\n\n`;
  txt += `6. WIDEŁKI\n${widełki}\n\n`;
  txt += `7. SYGNAŁ\n${sygnał}\n\n`;

  txt += `⭐ INTERPRETACJA\n`;
  if (sygnał === "RESET") txt += `🟥 Pełny RESET — brak impulsu i rytmu.\n`;
  else if (sygnał === "PRAWIE BUY") txt += `🟧 PRAWIE BUY — struktura OK, impuls słaby.\n`;
  else if (sygnał === "BUY") txt += `🟩 BUY — impuls + rytm + fundament.\n`;
  else txt += `CZEKAJ — brak warunków do wejścia.\n`;

  if (t === "KGHM" && lastCopper) {
    const cH = lastCopper.H;
    const cL = lastCopper.L;
    const cC = lastCopper.C;
    const cMA = lastCopper.MA20;
    const cD9 = lastCopper.DEMA9;
    const cRSI = lastCopper.RSI;

    txt += `\n⭐ KORELACJA Z COPPER\n`;
    txt += `Copper C=${cC}\nMA20=${cMA}, DEMA9=${cD9}, RSI=${cRSI}\n\n`;

    if (cC < cL) txt += `🟥 Copper = RESET → ciągnie KGHM w dół\n`;
    else if (cC > cL + (cH - cL) * 0.20 && cC < cL + (cH - cL) * 0.35)
      txt += `🟩 Copper = BUY zone → wspiera KGHM\n`;
    else txt += `🟧 Copper = neutralny\n`;
  }

  pokazPopupKomentarza(txt);
}

/* ============================================================
   POPUP KOMENTARZA
   ============================================================ */
function pokazPopupKomentarza(txt) {
  document.getElementById("popup-text").innerText = txt;
  document.getElementById("popup-komentarz").style.display = "block";
}

function zamknijPopupKomentarza() {
  document.getElementById("popup-komentarz").style.display = "none";
}

/* ============================================================
   SORTOWANIE
   ============================================================ */
function sortujPoSygnale() {
  const tbody = document.getElementById("tbody");
  const rows = [...tbody.rows];

  const ranking = {
    "BUY": 1,
    "PRAWIE BUY": 2,
    "CZEKAJ": 3,
    "CZEKAJ DO": 4,
    "UWAGA RESET": 5,
    "RESET": 6
  };

  rows.sort((a, b) => {
    const sA = a.cells[4].innerText.trim();
    const sB = b.cells[4].innerText.trim();
    return (ranking[sA] || 999) - (ranking[sB] || 999);
  });

  rows.forEach(r => tbody.appendChild(r));
}
</script>
  
/* ============================================================
   POPUP HTML
   ============================================================ */

<div id="popup-komentarz" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px);
  z-index:9999;
">
  <div style="
    background:#222;
    color:#eee;
    padding:20px;
    width:90%;
    max-width:600px;
    margin:60px auto;
    border:1px solid #555;
    white-space:pre-wrap;
    font-family:monospace;
  " id="popup-text"></div>

  <button onclick="zamknijPopupKomentarza()" style="
    display:block;
    margin:20px auto;
    padding:10px 20px;
    background:#b00;
    color:#fff;
    border:none;
    cursor:pointer;
  ">Zamknij</button>
</div>

</body>
</html>

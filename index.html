<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TURBO MOBILE 5.0+ OCR</title>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    body { font-family: Arial; background:#f6f7fb; margin:20px; }
    table { width:100%; border-collapse:collapse; background:white; }
    th, td { padding:8px 10px; border-bottom:1px solid #eee; font-size:13px; }
    th { background:#fafafa; font-weight:600; }
    button { padding:6px 8px; cursor:pointer; border-radius:4px; }

    .popup {
      display:none; position:fixed; z-index:9999;
      left:50%; top:50%; transform:translate(-50%,-50%);
      background:white; border:2px solid #222;
      padding:16px; width:360px; max-height:80vh; overflow:auto;
    }

    .signal-buy       { color:#0a7a3a; font-weight:700; }
    .signal-prawiebuy { color:#7ac70c; font-weight:700; }
    .signal-czekaj    { color:#555;   font-weight:700; }
    .signal-czekajdo  { color:#d4a000;font-weight:700; }
    .signal-uwagarese { color:#ff7f00;font-weight:700; }
    .signal-reset     { color:#b71c1c;font-weight:700; }
  </style>
</head>

<body>

<input 
  type="file"
  id="ocr-file-input"
  accept="image/*"
  multiple
  style="display:none;"
  onchange="wczytajOCRZPlikow(event)"
>

<h1>TURBO MOBILE 5.0+ — Panel</h1>

<table id="main-table">
  <thead>
    <tr>
      <th>📊</th>
      <th>Ticker</th>
      <th>Cena</th>
      <th>Entry</th>
      <th>Sygnał</th>
      <th>Widełki</th>
      <th>TP1</th>
      <th>TP2</th>
      <th>TP3</th>
      <th>🎤</th>
      <th>📎</th>
      <th>Akcje</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>📊</td>
      <td>—</td>
      <td><input class="price-input" oninput="aktualizujSygnał(this.closest('tr'))"></td>
      <td><input class="entry-input" oninput="sortujPoSygnale()"></td>
      <td class="signal-czekaj">CZEKAJ</td>
      <td>—</td>
      <td>—</td>
      <td>—</td>
      <td>—</td>
      <td><button onclick="uruchomMikrofon(this.closest('tr'))">🎤</button></td>
      <td><button onclick="document.getElementById('ocr-file-input').click()">📎</button></td>
      <td><button onclick="usunWiersz(this)">🗑 Usuń</button></td>
    </tr>
  </tbody>
</table>

<!-- POPUPY -->
<div id="popup-analiza-pro" class="popup">
  <h2>Analiza PRO 4.5</h2>
  <div id="analiza-pro-content"></div>
  <button onclick="zamknijPopupAnalizaPRO()">OK</button>
</div>

<div id="popup-ustawienia" class="popup">
  <h2>Ustawienia</h2>
  <button onclick="zamknijPopupUstawienia()">OK</button>
</div>

<div id="popup-reset" class="popup">
  <h2>Reset</h2>
  <button onclick="resetSygnałów()">Reset sygnałów</button>
  <button onclick="wyczyscTabele()">Wyczyść tabelę</button>
  <button onclick="zamknijPopupReset()">Anuluj</button>
</div>

<!-- POPUP OCR -->
<div id="popup-ocr" class="popup">
  <h2>OCR — podgląd</h2>
  <pre id="popup-ocr-raw" style="white-space:pre-wrap;font-size:11px;"></pre>
  <button onclick="zatwierdzOCR()">Użyj danych</button>
  <button onclick="zamknijPopupOCR()">Anuluj</button>
</div>
<script>
/* ============================================================
   1. OCR — wczytywanie screenów + popup
   ============================================================ */

let ostatniTekstOCR = "";

async function wczytajOCRZPlikow(event) {
  const pliki = event.target.files;
  if (!pliki || pliki.length === 0) return;

  for (const plik of pliki) {
    const reader = new FileReader();
    reader.onload = function(e) {
      startOCR(e.target.result);
    };
    reader.readAsDataURL(plik);
  }

  event.target.value = "";
}

async function startOCR(dataUrl) {
  const wynik = await Tesseract.recognize(dataUrl, 'eng');
  const text = wynik.data.text || "";

  ostatniTekstOCR = text;

  const pre = document.getElementById("popup-ocr-raw");
  if (pre) pre.textContent = text.trim() || "(brak tekstu)";

  const popup = document.getElementById("popup-ocr");
  if (popup) popup.style.display = "block";
}

function zatwierdzOCR() {
  if (ostatniTekstOCR) {
    przetworzTekstOCR(ostatniTekstOCR);
  }
  zamknijPopupOCR();
}

function zamknijPopupOCR() {
  const popup = document.getElementById("popup-ocr");
  if (popup) popup.style.display = "none";
}

/* ============================================================
   2. AUTOMATYCZNE WYKRYWANIE NAZWY SPÓŁKI (wersja odpornościowa)
   ============================================================ */

function generujTickerZNazwy(text) {
  const upper = text
    .toUpperCase()
    .replace(/[^A-Z0-9ĄĆĘŁŃÓŚŹŻ\s]/g, " ")
    .replace(/\s+/g, " ");

  // 1) Specjalne mapowania (działają nawet przy literówkach OCR)
  const mapowania = [
    { nazwy: ["GRUPA KETY", "GRUPA KĘTY", "KETY", "KĘTY"], ticker: "KTY" },
    { nazwy: ["ALLEGRO"], ticker: "ALE" },
    { nazwy: ["PKN ORLEN", "ORLEN"], ticker: "PKN" },
    { nazwy: ["CD PROJEKT", "CDPROJEKT"], ticker: "CDR" },
    { nazwy: ["MBANK"], ticker: "MBK" },
    { nazwy: ["ASBIS"], ticker: "ASB" },
    { nazwy: ["XTB"], ticker: "XTB" },
    { nazwy: ["JSW"], ticker: "JSW" }
  ];

  for (const m of mapowania) {
    for (const n of m.nazwy) {
      if (upper.includes(n)) return m.ticker;
    }
  }

  // 2) Automatyczne generowanie tickera z NAZWY (bez mapy)
  const slowa = upper.split(" ").filter(s => s.length >= 3);

  const blacklist = new Set([
    "WARSAW","STOCK","EXCHANGE","GPW","WIG","INDEX","FUTURES",
    "KONTRAKTY","CFD","RSI","WOLUMEN","VOLUME","MA","EMA","DEMA",
    "OPEN","HIGH","LOW","CLOSE","AUTO","UTC"
  ]);

  for (let s of slowa) {
    if (blacklist.has(s)) continue;

    if (s.length === 3) return s;
    if (s.length > 3) return s.slice(0,3);
  }

  return null;
}

/* ============================================================
   3. FALLBACK — skróty 2–5 liter
   ============================================================ */

function wykryjTickerZeSkrotow(text) {
  const upper = text.toUpperCase();
  const matches = upper.match(/\b[A-Z]{2,5}\b/g) || [];

  const blacklist = new Set([
    "GPW","W","MA","RSI","VOL","WOL","EXP","EMA","OPEN","HIGH","LOW","CLOSE",
    "O","H","L","C","MIN","MAX","BUY","SELL","LONG","SHORT","STOP","LOSS",
    "TF","UTC","LOG","PT","ST","ND","RD","TH","AUTO"
  ]);

  for (const m of matches) {
    if (!blacklist.has(m)) return m;
  }

  return null;
}

/* ============================================================
   4. GŁÓWNA FUNKCJA — wykrywanie tickera
   ============================================================ */

function wykryjTicker(text) {
  const zNazwy = generujTickerZNazwy(text);
  if (zNazwy) return zNazwy;

  const zeSkrotu = wykryjTickerZeSkrotow(text);
  if (zeSkrotu) return zeSkrotu;

  return "UNKNOWN";
}

/* ============================================================
   5. PARSER OCR (O/H/L/C, MA20, DEMA9, wolumen)
   ============================================================ */

function normalizujLiczbe(x) {
  if (!x) return null;
  return parseFloat(
    x.replace(/\s/g, "")
     .replace(",", ".")
  );
}

function przetworzTekstOCR(t) {
  t = t.replace(/\n/g, " ");

  const ticker = wykryjTicker(t);

  const O = normalizujLiczbe((t.match(/O\s*([0-9.,\s]+)/i) || [null,null])[1]);
  const H = normalizujLiczbe((t.match(/H\s*([0-9.,\s]+)/i) || [null,null])[1]);
  const L = normalizujLiczbe((t.match(/L\s*([0-9.,\s]+)/i) || [null,null])[1]);
  const C = normalizujLiczbe((t.match(/C\s*([0-9.,\s]+)/i) || [null,null])[1]);

  const MA20  = normalizujLiczbe((t.match(/MA\s*20[^0-9]*([0-9.,\s]+)/i) || [null,null])[1]);
  const DEMA9 = normalizujLiczbe((t.match(/(DEMA|PODWÓJNA)\s*ŚREDNIA[^0-9]*([0-9.,\s]+)/i) || [null,null])[2]);
  const VOL   = normalizujLiczbe((t.match(/WOLUMEN[^0-9]*([0-9.,\s]+)/i) || [null,null])[1]);
  const RVOL  = normalizujLiczbe((t.match(/RVOL[^0-9]*([0-9.,\s]+)/i) || [null,null])[1]);

  dodajLubAktualizujWiersz({ ticker, O, H, L, C, MA20, DEMA9, VOL, RVOL });
}
</script>
<script>
/* ============================================================
   6. SYGNAŁ 4.5
   ============================================================ */

function aktualizujSygnał(w) {
  const cena = parseFloat(w.cells[2].querySelector("input").value);
  const cell = w.cells[4];

  if (!w.cells[5].innerText.includes("–") || isNaN(cena)) return;

  const [dol, gor] = w.cells[5].innerText.split("–").map(parseFloat);

  const L = parseFloat(w.dataset.L || 0);
  const MA20 = parseFloat(w.dataset.MA20 || 0);
  const DEMA9 = parseFloat(w.dataset.DEMA9 || 0);

  const momentum = (DEMA9 && cena > DEMA9) ? "MOCNE" : "SŁABE";
  const bias = (MA20 && cena > MA20) ? "UP" : "DOWN";

  let s = "CZEKAJ";

  if (cena < dol) s = "CZEKAJ DO";

  if (cena >= dol && cena <= gor && momentum === "SŁABE")
      s = "PRAWIE BUY";

  if (cena >= dol && cena <= gor && momentum === "MOCNE" && bias === "UP")
      s = "BUY";

  if (cena > gor) s = "CZEKAJ";

  if (cena < dol * 0.995 && momentum === "SŁABE")
      s = "UWAGA RESET";

  if (cena < L && momentum === "SŁABE")
      s = "RESET";

  cell.innerText = s;
  kolorujSygnal(w, s);
  generujAnalizePRO(w);
}

function kolorujSygnal(w, s) {
  const cell = w.cells[4];

  cell.classList.remove(
    "signal-buy",
    "signal-prawiebuy",
    "signal-czekaj",
    "signal-czekajdo",
    "signal-uwagarese",
    "signal-reset"
  );

  if (s === "BUY")          cell.classList.add("signal-buy");
  if (s === "PRAWIE BUY")   cell.classList.add("signal-prawiebuy");
  if (s === "CZEKAJ")       cell.classList.add("signal-czekaj");
  if (s === "CZEKAJ DO")    cell.classList.add("signal-czekajdo");
  if (s === "UWAGA RESET")  cell.classList.add("signal-uwagarese");
  if (s === "RESET")        cell.classList.add("signal-reset");
}

/* ============================================================
   7. ANALIZA PRO 4.5
   ============================================================ */

function generujAnalizePRO(w) {
  const komentarz = generujKomentarz45(w);
  const el = document.getElementById("analiza-pro-content");
  if (el) el.innerHTML = komentarz;
}

function generujKomentarz45(w) {
  const O     = parseFloat(w.dataset.O     || 0);
  const H     = parseFloat(w.dataset.H     || 0);
  const L     = parseFloat(w.dataset.L     || 0);
  const C     = parseFloat(w.dataset.C     || 0);
  const MA20  = parseFloat(w.dataset.MA20  || 0);
  const DEMA9 = parseFloat(w.dataset.DEMA9 || 0);
  const VOL   = parseFloat(w.dataset.VOL   || 0);
  const RVOL  = parseFloat(w.dataset.RVOL  || 0);

  const cena   = parseFloat(w.cells[2].querySelector("input").value || 0);
  const sygnal = w.cells[4].innerText;
  const widelki = w.cells[5].innerText;

  let struktura = "...";
  if (C > O && H > C)       struktura = "IMPULS WZROSTOWY";
  else if (C < O && L < C)  struktura = "IMPULS SPADKOWY";
  else if (C > O)           struktura = "KOREKTA WZROSTOWA";
  else if (C < O)           struktura = "KOREKTA SPADKOWA";

  let momentum = DEMA9 ? (cena > DEMA9 ? "MOCNE" : "SŁABE") : "...";

  let srednie = "...";
  if (MA20 && DEMA9) {
    if (cena > MA20 && cena > DEMA9)      srednie = "WSKAZUJĄ UP";
    else if (cena < MA20 && cena < DEMA9) srednie = "WSKAZUJĄ DOWN";
    else                                  srednie = "NEUTRALNE";
  }

  let wol = "...";
  if (RVOL >= 1.5)      wol = "MOCNY";
  else if (RVOL >= 1.0) wol = "ŚREDNI";
  else                  wol = "SŁABY";

  const uzasadnienie = interpretacjaPRO(
    sygnal, struktura, srednie, wol, momentum, C > O ? "zielona" : "czerwona"
  );

  let bias = "...";
  if (srednie.includes("UP") && momentum === "MOCNE")        bias = "UP";
  else if (srednie.includes("DOWN") && momentum === "SŁABE") bias = "DOWN";
  else                                                       bias = "NEUTRAL";

  return `
1. STRUKTURA<br>
- świeca: O=${O}, H=${H}, L=${L}, C=${C}<br>
➡️ ${struktura}<br><br>

2. MOMENTUM<br>
➡️ ${momentum}<br><br>

3. ŚREDNIE<br>
➡️ ${srednie}<br><br>

4. WOLUMEN<br>
➡️ ${wol}<br><br>

5. SYGNAŁ SYSTEMU 4.5<br>
➡️ ${sygnal}<br>
➡️ ${uzasadnienie}<br><br>

6. BIAS<br>
➡️ ${bias}<br><br>

7. WIDEŁKI BUY<br>
➡️ ${widelki}<br>
`;
}

function interpretacjaPRO(sygnal, struktura, srednie, wol, momentum, swieca) {
  if (sygnal === "BUY") return "Cena w widełkach, struktura i momentum sprzyjają wejściu.";
  if (sygnal === "PRAWIE BUY") return "Blisko wejścia — momentum słabe, ale strefa dobra.";
  if (sygnal === "CZEKAJ DO") return "Cena poniżej strefy — czekaj na wejście.";
  if (sygnal === "UWAGA RESET") return "Ryzyko wybicia w dół — obserwuj świecę.";
  if (sygnal === "RESET") return "Układ stracił przewagę — czekaj na nową świecę.";
  return "Brak przewagi — obserwuj.";
}

/* ============================================================
   8. SORTOWANIE
   ============================================================ */

function sortujPoSygnale() {
  const tabela = document.getElementById("main-table");
  const rows = Array.from(tabela.rows).slice(1);

  const priorytet = { 
    "BUY":1, 
    "PRAWIE BUY":2, 
    "CZEKAJ DO":3, 
    "CZEKAJ":4, 
    "UWAGA RESET":5,
    "RESET":6 
  };

  rows.sort((a,b) =>
    (priorytet[a.cells[4].innerText]||99) -
    (priorytet[b.cells[4].innerText]||99)
  );

  rows.forEach(r => tabela.appendChild(r));
}

/* ============================================================
   9. MIKROFON
   ============================================================ */

let recognition = null;
let aktywnyWiersz = null;

function uruchomMikrofon(wiersz) {
  aktywnyWiersz = wiersz;

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert("Twoja przeglądarka nie obsługuje mikrofonu.");
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();

  recognition.lang = "pl-PL";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.start();

  recognition.onresult = function(event) {
    const tekst = event.results[0][0].transcript;
    const liczba = tekst.replace(",", ".").match(/[0-9.]+/);

    if (!liczba) return alert("Nie rozpoznano liczby.");

    const cena = parseFloat(liczba[0]);
    if (isNaN(cena)) return alert("Niepoprawna liczba.");

    aktywnyWiersz.cells[2].querySelector("input").value = cena.toFixed(3);

    aktualizujSygnał(aktywnyWiersz);
    sortujPoSygnale();
  };

  recognition.onerror = function() {
    alert("Błąd mikrofonu.");
  };
}

/* ============================================================
   10. RESET / USUWANIE / POPUPY
   ============================================================ */

function resetSygnałów() {
  const tabela = document.getElementById("main-table");
  for (let i = 1; i < tabela.rows.length; i++) {
    tabela.rows[i].cells[4].innerText = "CZEKAJ";
    kolorujSygnal(tabela.rows[i], "CZEKAJ");
  }
}

function wyczyscTabele() {
  const tabela = document.getElementById("main-table");
  while (tabela.rows.length > 1) tabela.deleteRow(1);
}

function usunWiersz(btn) {
  const tr = btn.closest("tr");
  if (tr) tr.remove();
}

function zamknijPopupAnalizaPRO(){ 
  document.getElementById("popup-analiza-pro").style.display="none"; 
}

function pokazPopupUstawienia(){ 
  document.getElementById("popup-ustawienia").style.display="block"; 
}

function zamknijPopupUstawienia(){ 
  document.getElementById("popup-ustawienia").style.display="none"; 
}

function pokazPopupReset(){ 
  document.getElementById("popup-reset").style.display="block"; 
}

function zamknijPopupReset(){ 
  document.getElementById("popup-reset").style.display="none"; 
}
</script>

</body>
</html>

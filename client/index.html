<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TURBO MOBILE 5 — AI Vision</title>

  <style>
    body { font-family: Arial; background:#f6f7fb; margin:20px; }
    table { width:100%; border-collapse:collapse; background:white; }
    th, td { padding:8px 10px; border-bottom:1px solid #eee; font-size:13px; }
    th { background:#fafafa; font-weight:600; }
    button { padding:6px 8px; cursor:pointer; border-radius:4px; }

    .signal-buy       { color:#0a7a3a; font-weight:700; }
    .signal-prawiebuy { color:#7ac70c; font-weight:700; }
    .signal-czekaj    { color:#555;   font-weight:700; }
    .signal-czekajdo  { color:#d4a000;font-weight:700; }
    .signal-uwagarese { color:#ff7f00;font-weight:700; }
    .signal-reset     { color:#b71c1c;font-weight:700; }

    .trail-active {
      background-color: #0a4f0a !important;
      color: white !important;
    }
  </style>
</head>

<body>

<button onclick="resetTabeli()" style="margin-bottom:15px;background:#ff4444;color:white;">
  🔄 RESET (czyści wszystko oprócz ENTRY)
</button>

<input 
  type="file"
  id="ocr-file-input"
  accept="image/*"
  multiple
  style="display:none;"
  onchange="wczytajOCRZPlikow(event)"
>

<h1>TURBO MOBILE 5 — XTB + AI Vision</h1>

<table id="main-table">
  <thead>
    <tr>
      <th>📊</th>
      <th>Ticker</th>
      <th>Cena</th>
      <th>Entry</th>
      <th>Sygnał</th>
      <th>Widełki</th>
      <th>TP1</th>
      <th>TP2</th>
      <th>TP3</th>
      <th>🎤</th>
      <th>📎</th>
      <th>Akcje</th>
    </tr>
  </thead>

  <tbody id="tbody">
    <tr data-ticker="NEW">
      <td>📊</td>
      <td>—</td>
      <td><input class="price-input"></td>
      <td><input class="entry-input"></td>
      <td class="signal-czekaj">CZEKAJ</td>
      <td>—</td>
      <td>—</td>
      <td>—</td>
      <td>—</td>
      <td><button onclick="uruchomMikrofon(this.closest('tr'))">🎤</button></td>
      <td><button onclick="document.getElementById('ocr-file-input').click()">📎</button></td>
      <td>—</td>
    </tr>
  </tbody>
</table>

<script>
const OCR_URL = "https://turbo-mobile-5a.onrender.com/ocr";

/* ============================================================
   OCR — backend AI Vision (Donut na Render)
   ============================================================ */

async function wczytajOCRZPlikow(event) {
  const pliki = event.target.files;
  if (!pliki || pliki.length === 0) return;

  for (const plik of pliki) {
    await startOCR(plik);
  }

  event.target.value = "";
}

async function startOCR(file) {
  try {
    const form = new FormData();
    form.append("file", file, file.name || "screen.png");

    const res = await fetch(OCR_URL, {
      method: "POST",
      body: form
    });

    const d = await res.json();
    console.log("OCR RESPONSE (AI Vision):", d);

    dodajLubAktualizujWiersz(d);
    zapiszTabele();
  } catch (e) {
    console.error("Błąd AI Vision:", e);
    alert("Błąd AI Vision / OCR");
  }
}

/* ============================================================
   TWORZENIE / AKTUALIZACJA WIERSZA + FALLBACK OCR
   ============================================================ */

function dodajLubAktualizujWiersz(d) {
  if (!d.ticker && aktywnyWiersz) {
    d.ticker = aktywnyWiersz.dataset.ticker;
  }
  if (!d.ticker) return;

  const tbody = document.getElementById("tbody");
  let w = [...tbody.rows].find(r => r.dataset.ticker === d.ticker);

  if (!w) {
    w = tbody.insertRow(-1);
    w.dataset.ticker = d.ticker;

    w.insertCell(0).innerText = "📊";
    w.insertCell(1).innerText = d.ticker;

    w.insertCell(2).innerHTML = `<input class="price-input" oninput="aktualizujSygnał(this.closest('tr'));zapiszTabele()">`;
    w.insertCell(3).innerHTML = `<input class="entry-input" oninput="zapiszTabele()">`;

    w.insertCell(4).innerText = "CZEKAJ";
    w.insertCell(5).innerText = "—";
    w.insertCell(6).innerText = "—";
    w.insertCell(7).innerText = "—";
    w.insertCell(8).innerText = "—";

    w.insertCell(9).innerHTML  = `<button onclick="uruchomMikrofon(this.closest('tr'))">🎤</button>`;
    w.insertCell(10).innerHTML = `<button onclick="document.getElementById('ocr-file-input').click()">📎</button>`;
    w.insertCell(11).innerHTML = `<button onclick="usunWiersz(this);zapiszTabele()">🗑 Usuń</button>`;
  }

  w.dataset.interval = d.interval;

  if (d.interval === "M5") {
    if (d.C) {
      w.cells[2].querySelector("input").value = Number(d.C).toFixed(3);
      w.dataset.C = d.C;
    }
    if (d.DEMA9) w.dataset.DEMA9 = d.DEMA9;
    if (d.RSI)   w.dataset.RSI   = d.RSI;
    if (d.VOL)   w.dataset.VOL   = d.VOL;
  }

  if (d.interval === "M15") {
    if (d.H && d.L) {
      const dol = d.L + (d.H - d.L) * 0.20;
      const gor = d.L + (d.H - d.L) * 0.35;
      w.cells[5].innerText = dol.toFixed(3) + "–" + gor.toFixed(3);
    }
    if (d.MA20) w.dataset.MA20 = d.MA20;
  }

  if (d.interval === "H1" || d.interval === "D1") {
    if (d.MA20) w.dataset.MA20 = d.MA20;
  }

  if (d.O) w.dataset.O = d.O;
  if (d.H) w.dataset.H = d.H;
  if (d.L) w.dataset.L = d.L;
  if (d.C && !w.dataset.C) w.dataset.C = d.C;

  aktualizujSygnał(w);
  zapiszDaneDoKorelacji(d);
  zastosujKorelacjeKGHM(w);
  sortujPoSygnale();
  zapiszTabele();
}
</script>
<script>
/* ============================================================
   SYGNAŁ 4.5
   ============================================================ */

function aktualizujSygnał(w) {
  const cena = parseFloat(w.cells[2].querySelector("input").value);
  const cell = w.cells[4];

  if (!w.cells[5].innerText.includes("–") || isNaN(cena)) return;

  const [dol, gor] = w.cells[5].innerText.split("–").map(parseFloat);

  const L     = parseFloat(w.dataset.L     || 0);
  const MA20  = parseFloat(w.dataset.MA20  || 0);
  const DEMA9 = parseFloat(w.dataset.DEMA9 || 0);

  const momentum = (DEMA9 && cena > DEMA9) ? "MOCNE" : "SŁABE";
  const bias     = (MA20 && cena > MA20)   ? "UP"   : "DOWN";

  let s = "CZEKAJ";

  if (cena < dol) s = "CZEKAJ DO";
  if (cena >= dol && cena <= gor && momentum === "SŁABE")                  s = "PRAWIE BUY";
  if (cena >= dol && cena <= gor && momentum === "MOCNE" && bias === "UP") s = "BUY";
  if (cena > gor) s = "CZEKAJ";
  if (cena < dol * 0.995 && momentum === "SŁABE") s = "UWAGA RESET";
  if (cena < L && momentum === "SŁABE")           s = "RESET";

  aktualizujTrailing(w);
  cell.innerText = s;
  kolorujSygnal(w, s);
}

/* ============================================================
   KOLORY SYGNAŁÓW
   ============================================================ */

function kolorujSygnal(w, s) {
  const cell = w.cells[4];
  cell.className = "";

  if (s === "BUY")          cell.classList.add("signal-buy");
  if (s === "PRAWIE BUY")   cell.classList.add("signal-prawiebuy");
  if (s === "CZEKAJ")       cell.classList.add("signal-czekaj");
  if (s === "CZEKAJ DO")    cell.classList.add("signal-czekajdo");
  if (s === "UWAGA RESET")  cell.classList.add("signal-uwagarese");
  if (s === "RESET")        cell.classList.add("signal-reset");
}

/* ============================================================
   PEŁNY TP / TRAILING TP3 + PODŚWIETLENIE WIERSZA
   ============================================================ */

function aktualizujTrailing(w) {
  const cena  = parseFloat(w.cells[2].querySelector("input").value);
  const entry = parseFloat(w.cells[3].querySelector("input").value);

  if (isNaN(cena) || isNaN(entry) || entry <= 0) return;

  const tp1 = entry * 1.01;
  const tp2 = entry * 1.02;
  const tp3 = entry * 1.03;

  w.dataset.TP1 = tp1.toFixed(3);
  w.dataset.TP2 = tp2.toFixed(3);
  w.dataset.TP3 = tp3.toFixed(3);

  const trailingSL = entry * 1.015;
  w.dataset.TRAILING_SL = trailingSL.toFixed(3);

  w.classList.remove("trail-active");

  if (cena > tp3) {
    w.classList.add("trail-active");
  }

  if (cena < trailingSL) {
    w.classList.remove("trail-active");
  }
}

/* ============================================================
   KORELACJA KGHM ↔ MIEDŹ
   ============================================================ */

let lastCopper = null;
let lastKGHM   = null;

function zapiszDaneDoKorelacji(d) {
  if (d.ticker === "COPPER") lastCopper = d;
  if (d.ticker === "KGH")    lastKGHM   = d;
}

function zastosujKorelacjeKGHM(w) {
  if (!lastCopper || !lastKGHM) return;
  if (w.dataset.ticker !== "KGH") return;

  const cell = w.cells[4];
  let s = cell.innerText;

  const cH  = lastCopper.H;
  const cL  = lastCopper.L;
  const cC  = lastCopper.C;
  const cMA = lastCopper.MA20;

  if (!cH || !cL || !cC) return;

  if (cC < cL) {
    s = "RESET";
    cell.innerText = s;
    kolorujSygnal(w, s);
    return;
  }

  const copperBuy =
    cC > cL + (cH - cL) * 0.20 &&
    cC < cL + (cH - cL) * 0.35;

  if (copperBuy) {
    if (s === "PRAWIE BUY") s = "BUY";
    if (s === "CZEKAJ DO")  s = "PRAWIE BUY";
  }

  if (cMA && cC > cMA) {
    if (s === "CZEKAJ") s = "PRAWIE BUY";
  }

  cell.innerText = s;
  kolorujSygnal(w, s);
}
</script>
<script>
/* ============================================================
   SORTOWANIE WG SYGNAŁU
   ============================================================ */

function sortujPoSygnale() {
  const tbody = document.getElementById("tbody");
  const rows = [...tbody.rows].filter(r => r.dataset.ticker !== "NEW");

  const priorytet = { 
    "BUY":1, 
    "PRAWIE BUY":2, 
    "CZEKAJ DO":3, 
    "CZEKAJ":4, 
    "UWAGA RESET":5,
    "RESET":6 
  };

  rows.sort((a,b) =>
    (priorytet[a.cells[4].innerText]||99) -
    (priorytet[b.cells[4].innerText]||99)
  );

  rows.forEach(r => tbody.appendChild(r));
}

/* ============================================================
   RESET — czyści wszystko oprócz ENTRY
   ============================================================ */

function resetTabeli() {
  const tbody = document.getElementById("tbody");

  [...tbody.rows].forEach(r => {
    if (r.dataset.ticker === "NEW") return;

    const ticker = r.dataset.ticker;
    const entry  = r.cells[3].querySelector("input").value;

    r.innerHTML = `
      <td>📊</td>
      <td>${ticker}</td>
      <td><input class="price-input" oninput="aktualizujSygnał(this.closest('tr'));zapiszTabele()"></td>
      <td><input class="entry-input" value="${entry}" oninput="zapiszTabele()"></td>
      <td class="signal-czekaj">CZEKAJ</td>
      <td>—</td>
      <td>—</td>
      <td>—</td>
      <td>—</td>
      <td><button onclick="uruchomMikrofon(this.closest('tr'))">🎤</button></td>
      <td><button onclick="document.getElementById('ocr-file-input').click()">📎</button></td>
      <td><button onclick="usunWiersz(this);zapiszTabele()">🗑 Usuń</button></td>
    `;

    r.dataset.ticker = ticker;
  });

  zapiszTabele();
}

/* ============================================================
   USUWANIE WIERSZA
   ============================================================ */

function usunWiersz(btn) {
  const row = btn.closest("tr");
  row.remove();
  zapiszTabele();
}

/* ============================================================
   AKTYWNY WIERSZ (mikrofon + fallback OCR)
   ============================================================ */

let aktywnyWiersz = null;

document.addEventListener("click", e => {
  const tr = e.target.closest("tr");
  if (tr && tr.dataset.ticker && tr.dataset.ticker !== "NEW") {
    aktywnyWiersz = tr;
  }
});
</script>
<script>
/* ============================================================
   MIKROFON 2.0 — ticker + cena / sama cena
   ============================================================ */

function uruchomMikrofon(wiersz) {
  aktywnyWiersz = wiersz;

  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "pl-PL";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.start();

  recognition.onresult = e => {
    const tekst = e.results[0][0].transcript.trim();
    obsluzTekstZMikrofonu(tekst);
  };

  recognition.onerror = () => {
    alert("Błąd mikrofonu");
  };
}

function obsluzTekstZMikrofonu(tekst) {
  const parts = tekst.toUpperCase().split(" ");

  const liczba = parts.find(p => p.replace(",", ".").match(/^[0-9.]+$/));
  const cena = liczba ? parseFloat(liczba.replace(",", ".")) : null;

  const slowo = parts.find(p => isNaN(p) && p.length >= 3);
  const ticker = slowo || null;

  if (ticker && cena) {
    ustawTickerICene(ticker, cena);
    return;
  }

  if (!ticker && cena) {
    ustawTylkoCene(cena);
    return;
  }

  alert("Powiedz np. 'Dino 33.6' albo '33.6'");
}

function ustawTickerICene(ticker, cena) {
  const tbody = document.getElementById("tbody");
  let w = [...tbody.rows].find(r => r.dataset.ticker === ticker);

  if (!w) {
    w = tbody.insertRow(-1);
    w.dataset.ticker = ticker;

    w.insertCell(0).innerText = "📊";
    w.insertCell(1).innerText = ticker;

    w.insertCell(2).innerHTML = `<input class="price-input">`;
    w.insertCell(3).innerHTML = `<input class="entry-input">`;

    w.insertCell(4).innerText = "CZEKAJ";
    w.insertCell(5).innerText = "—";
    w.insertCell(6).innerText = "—";
    w.insertCell(7).innerText = "—";
    w.insertCell(8).innerText = "—";

    w.insertCell(9).innerHTML = `<button onclick="uruchomMikrofon(this.closest('tr'))">🎤</button>`;
    w.insertCell(10).innerHTML = `<button onclick="document.getElementById('ocr-file-input').click()">📎</button>`;
    w.insertCell(11).innerHTML = `<button onclick="usunWiersz(this);zapiszTabele()">🗑 Usuń</button>`;
  }

  aktywnyWiersz = w;

  w.cells[2].querySelector("input").value = cena.toFixed(3);

  aktualizujSygnał(w);
  sortujPoSygnale();
  zapiszTabele();
}

function ustawTylkoCene(cena) {
  if (!aktywnyWiersz) {
    alert("Najpierw kliknij wiersz, aby ustawić cenę głosem");
    return;
  }

  aktywnyWiersz.cells[2].querySelector("input").value = cena.toFixed(3);

  aktualizujSygnał(aktywnyWiersz);
  sortujPoSygnale();
  zapiszTabele();
}

/* ============================================================
   LOCALSTORAGE — PAMIĘĆ TABELI
   ============================================================ */

function zapiszTabele() {
  const tbody = document.getElementById("tbody");
  const data = [...tbody.rows]
    .filter(r => r.dataset.ticker !== "NEW")
    .map(r => ({
      ticker:  r.dataset.ticker,
      price:   r.cells[2].querySelector("input").value,
      entry:   r.cells[3].querySelector("input").value,
      widełki: r.cells[5].innerText,
      O:       r.dataset.O,
      H:       r.dataset.H,
      L:       r.dataset.L,
      C:       r.dataset.C,
      MA20:    r.dataset.MA20,
      DEMA9:   r.dataset.DEMA9,
      RSI:     r.dataset.RSI,
      VOL:     r.dataset.VOL,
      interval:r.dataset.interval
    }));

  localStorage.setItem("tabela", JSON.stringify(data));
}

function wczytajTabele() {
  const data = JSON.parse(localStorage.getItem("tabela") || "[]");
  data.forEach(d => dodajLubAktualizujWiersz(d));
}

wczytajTabele();
</script>

</body>
</html>
